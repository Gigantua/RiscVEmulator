# Minimal Xorg config for the rvemu MMU target: the framebuffer has no
# DRM/KMS, so force the fbdev driver onto /dev/fb0, and bind evdev input
# to the two devices the rvemu-input daemon publishes (event0 = keyboard,
# event1 = mouse). No udev on this rootfs, so input is configured statically.

# Preload fbdevhw so its symbols (fbdevHWSave, ...) are in the global
# namespace before fbdev_drv.so is dlopen'd — otherwise the fbdev driver
# fails with "undefined symbol: fbdevHWSave" and X aborts (no screens).
Section "Module"
	Load "fbdevhw"
EndSection

Section "ServerLayout"
	Identifier  "rvemu"
	Screen      0 "Screen0"
	InputDevice "kbd"   "CoreKeyboard"
	InputDevice "mouse" "CorePointer"
	Option      "AutoAddDevices" "false"
EndSection

Section "Device"
	Identifier "fb0"
	Driver     "fbdev"
	Option     "fbdev" "/dev/fb0"
EndSection

Section "Screen"
	Identifier "Screen0"
	Device     "fb0"
EndSection

Section "InputDevice"
	Identifier "kbd"
	Driver     "evdev"
	Option     "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
	Identifier "mouse"
	Driver     "evdev"
	Option     "Device" "/dev/input/event1"
EndSection
